[build]
  base = "frontend"
  publish = "dist/clip-maker-frontend/browser"
  command = "npm run build"

# API Reverse Proxy: Forward all frontend /api/* calls to your deployed backend
[[redirects]]
  from = "/api/*"
  to = "https://clip-maker-3.onrender.com/api/:splat"
  status = 200
  force = true

# Video and Subtitles Reverse Proxy: Forward all /output/* calls to your deployed backend
[[redirects]]
  from = "/output/*"
  to = "https://clip-maker-3.onrender.com/output/:splat"
  status = 200
  force = true

# Angular Single Page App (SPA) fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
