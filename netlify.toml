[build]
  base = "frontend"
  publish = "dist/clip-maker-frontend/browser"
  command = "npm run build"

# API Reverse Proxy: Forward all frontend /api/* calls to your deployed backend
# Change the 'to' URL to your actual backend URL (from Render, Hugging Face, or Cloudflare Tunnel)
[[redirects]]
  from = "/api/*"
  to = "https://clip-maker-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Angular Single Page App (SPA) fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
